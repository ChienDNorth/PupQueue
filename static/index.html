<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PupQueue</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f2f6ff,#0d1224);--fg:light-dark(#16203a,#e6ebfb);--card:light-dark(#fff,#151c34);--line:light-dark(#d9e2f7,#27325a);
--muted:light-dark(#5f6f93,#97a4cb);--accent:#4f63f0;--accent-text:light-dark(#3b4fd9,#93a4ff);--accent-soft:light-dark(#e6ebff,#222c55);
--pc:light-dark(#5065f5,#7f93ff);--danger:light-dark(#d1344a,#ff7b8d);--shadow-c:light-dark(rgba(50,70,160,.18),rgba(0,0,0,.6));
--shadow:0 .5rem 1.5rem var(--shadow-c);--dw:27rem;
--ok-bg:light-dark(#e2f6ea,#15372a);--ok-fg:light-dark(#18763f,#79e0a6);--bad-bg:light-dark(#fde8eb,#3d1d28);--bad-fg:light-dark(#b42a40,#ff8da0);
--zz-bg:light-dark(#efeafc,#2b2550);--zz-fg:light-dark(#5b3fc0,#b6a6ff);
/* type scale: page title / body / label+control / meta / caption */
--fs-xl:1.25rem;--fs-lg:1rem;--fs-md:.9rem;--fs-sm:.82rem;--fs-xs:.72rem}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
a{color:var(--accent-text)}
*{box-sizing:border-box}
/* auto zoom: the root font size follows the window width, everything else is in rem */
html{font-size:clamp(14px,calc(9px + .45vw),24px)}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs-lg)/1.45 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
#page{min-height:100vh;display:flex;flex-direction:column;transition:margin-right .22s ease}
@media(min-width:60rem){body.has-detail #page{margin-right:var(--dw)}}
header{display:flex;gap:.5rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);border-top:3px solid var(--accent);background:var(--card);flex-wrap:wrap}
header h1{font-size:var(--fs-xl);margin:0 .8rem 0 0;color:var(--accent-text)}
header .logo{height:2.2rem;width:auto}
.nav{display:flex;gap:.3rem}
.lang{display:inline-flex;align-items:center;gap:.25rem;font-size:var(--fs-md)}
.lang select{padding:.25rem .4rem}
main{flex:1;padding:1rem}
footer{padding:.8rem 1rem;text-align:center;font-size:var(--fs-xs);color:var(--muted);border-top:1px solid var(--line)}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:.4rem;padding:.35rem .6rem}
button{cursor:pointer;font-size:var(--fs-md);padding:.3rem .75rem}button:hover{border-color:var(--accent)}
button.sm{font-size:var(--fs-xs);padding:.12rem .55rem;border-radius:.35rem}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hide{display:none!important}.dim{color:var(--muted)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.wrap{max-width:72rem;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.5rem .7rem;margin-bottom:.9rem;background:var(--card);border:1px solid var(--line);border-radius:.7rem;font-size:var(--fs-sm)}
.toolbar select,.toolbar input:not([type=checkbox]){font-size:var(--fs-sm);padding:.2rem .45rem}
.toolbar .sp{flex:1}.toolbar label{display:inline-flex;align-items:center;gap:.3rem}
.toolbar button{font-size:var(--fs-sm);padding:.2rem .55rem}
/* icon-only buttons (settings gear, info) */
.ib{display:inline-flex;align-items:center;justify-content:center;border:0;background:none;padding:.2rem;border-radius:50%;color:var(--muted);vertical-align:middle}
.ib:hover{color:var(--accent-text);background:var(--accent-soft)}.ib svg{width:1.1em;height:1.1em}
.ib.big{padding:.35rem;color:var(--fg)}.ib.big svg{width:1.35rem;height:1.35rem}.ib.on{color:#fff}
.flashset{animation:flashset 1.8s ease-out}@keyframes flashset{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:0 0 0 3px transparent}}
/* range popup: two sliders on one track, plus boxes to type the numbers */
.rpop{padding:.5rem .6rem;width:17rem}
.dual{position:relative;height:1.6rem;margin:.3rem .1rem .5rem}
.dual::before,.dual i{content:"";position:absolute;top:50%;height:.3rem;margin-top:-.15rem;border-radius:1rem}
.dual::before{left:0;right:0;background:var(--line)}.dual i{background:var(--accent)}
.dual input{position:absolute;inset:0;width:100%;margin:0;padding:0;border:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--accent);border:2px solid var(--card);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--accent);border:2px solid var(--card);cursor:pointer}
.rin{display:flex;gap:.4rem;align-items:center}.rin input{flex:1;min-width:0;font-size:var(--fs-md);padding:.2rem .4rem}.rin input.bad{border-color:var(--danger)}
.rsort{margin-top:.5rem;font-size:var(--fs-md)}.rsort label{display:flex;align-items:center;gap:.4rem;padding:.1rem 0}
#pmenu .racts{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.6rem}#pmenu .racts button{width:auto;padding:.2rem .7rem;font-size:var(--fs-sm)}
#pmenu .racts .primary,#pmenu .racts .primary:hover{background:var(--accent);color:#fff}
/* payment method icons: an uploaded image, or a letter badge */
.picon{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;border-radius:50%;color:#fff;font-size:.8em;font-weight:700;flex:none;vertical-align:middle}
img.picon{border-radius:.25em;object-fit:contain}
.psel{display:flex;gap:.4rem;align-items:center}.psel select{flex:1}.psel span:empty{display:none}.psel .picon{font-size:1.2rem}
.prow{display:flex;align-items:center;gap:.6rem;margin:.35rem 0;font-size:var(--fs-md)}.prow .picon{font-size:1.2rem}.prow .pn{flex:1}
.count{color:var(--muted);font-size:var(--fs-sm)}

/* task cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:.8rem .95rem .65rem;margin-bottom:.7rem;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--accent)}.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.snoozed{opacity:.6}.card[draggable]{cursor:grab}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.7rem}
.c-title{font-size:var(--fs-lg);font-weight:600;line-height:1.3;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.45rem}
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:1rem;padding:.05rem .6rem;font-size:var(--fs-xs);font-weight:500;background:var(--accent-soft);color:var(--accent-text)}
.chip.gray{background:none;border:1px solid var(--line);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)}.chip.bad{background:var(--bad-bg);color:var(--bad-fg)}.chip.zz{background:var(--zz-bg);color:var(--zz-fg)}
.facts{display:flex;flex-wrap:wrap;gap:.35rem 1.6rem;margin-top:.65rem}
.fact{display:flex;flex-direction:column;min-width:4.5rem}
.fact small{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fact span{font-size:var(--fs-md);font-weight:500}
.c-line{margin-top:.55rem;font-size:var(--fs-sm);color:var(--muted);word-break:break-word}
.c-notes{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.c-thumbs{display:flex;gap:.3rem;margin-top:.6rem;align-items:center}
.c-thumbs img{width:4rem;height:4rem;object-fit:cover;border-radius:.35rem;border:1px solid var(--line)}
.c-thumbs .more{font-size:var(--fs-xs);color:var(--muted)}
.c-foot{display:flex;gap:.35rem;align-items:center;margin-top:.65rem;padding-top:.5rem;border-top:1px solid var(--line)}
.c-foot .sp{flex:1}
.mdone{display:inline-flex;align-items:center;gap:.35rem}.mdone svg{width:1.15em;height:1.15em;flex:none}
.mdone[aria-pressed=true]{border-color:#00873a;color:var(--ok-fg)}
/* mark-done countdown: a bar that shrinks to nothing; the negative delay keeps its place across re-renders */
.cd{height:.25rem;margin-top:.5rem;border-radius:1rem;background:var(--line);overflow:hidden}
.cd i{display:block;height:100%;background:#00873a;animation:cd linear forwards}
@keyframes cd{from{width:100%}to{width:0}}
.board{display:grid;grid-template-columns:repeat(4,minmax(14rem,1fr));gap:.8rem;overflow-x:auto;align-items:start}
.col{background:var(--bg);border:1px dashed var(--line);border-radius:.7rem;padding:.6rem;min-height:12rem}.col.over{border-color:var(--accent)}
/* each board column has its own tint so the stages are easy to tell apart */
.col[data-s=Waitlist]{background:light-dark(#e2d6fd,#3a2c72)}.col[data-s=Ready]{background:light-dark(#d3deff,#1f3478)}
.col[data-s=WIP]{background:light-dark(#ffe2ad,#4d3812)}.col[data-s=Completed]{background:light-dark(#c9efd7,#12492f)}
.col h3{display:flex;align-items:center;gap:.4rem;margin:0 0 .6rem;font-size:var(--fs-md)}.col h3 .sp{flex:1}.col>.count{margin:-.3rem 0 .6rem;font-size:var(--fs-xs)}
.cnt{font-size:var(--fs-xs);font-weight:500;background:var(--accent-soft);color:var(--accent-text);border-radius:1rem;padding:0 .5rem}
.thumbs img{height:9rem;margin:.3rem .3rem 0 0;border-radius:.3rem}

/* task dialog */
dialog{padding:0;width:min(46rem,94vw);max-height:92vh;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:.8rem;box-shadow:var(--shadow);overflow:hidden}
dialog::backdrop{background:rgba(8,14,40,.5)}
#form{display:flex;flex-direction:column;max-height:92vh}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;flex-wrap:wrap;padding:.8rem 1.1rem;border-bottom:1px solid var(--line);background:var(--card)}
.dhead h2{margin:.3rem 0 0;font-size:var(--fs-xl)}
.dbody{overflow:auto;padding:1rem 1.1rem .4rem;flex:1;min-height:0}
.dfoot{display:flex;gap:.5rem;align-items:center;justify-content:flex-end;padding:.7rem 1.1rem;border-top:1px solid var(--line);background:var(--card)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.8rem 1rem;margin-bottom:.8rem}
.sec>h3,.dsec>h3,.settings>h3{margin:0 0 .6rem;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.07em;color:var(--accent-text)}
.sec>.grid+.fld,.sec>.fld+.fld,.sec>.fld+.grid,.sec>.grid+.grid,.sec>.chk+.grid{margin-top:.7rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.7rem}
.fld{display:block}.fld>span{display:block;font-size:var(--fs-sm);color:var(--muted);margin-bottom:.2rem}
.fld input:not([type=checkbox]):not([type=file]):not([type=radio]),.fld select,.fld textarea{width:100%}
.inl{display:flex;gap:.4rem}.inl input{flex:1;min-width:0}.inl select{width:6rem}
.chk{display:flex;align-items:center;gap:.5rem;margin-top:.7rem;cursor:pointer}
.hint{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:.2rem;min-height:1.1em}
.ferr{display:block;color:var(--danger);font-size:var(--fs-sm);margin-top:.2rem}.ferr:empty{display:none}
.bad input,.bad select,.bad textarea,.bad .dtbtn{border-color:var(--danger)}
.srow{display:flex;gap:.4rem;margin-bottom:.4rem}.srow input{flex:1}.srow select{width:9rem}
.th{position:relative;display:inline-block}.th button{position:absolute;top:.3rem;right:.4rem;padding:0 .35rem;line-height:1.2;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0}
#perr{color:var(--danger);font-size:var(--fs-sm)}

/* priority: signal-bar icon + click-to-open menus */
.bars{height:1.05em;flex:none}.bars rect{fill:var(--pc)}.bars .off{opacity:.3}
.pb,.pickp{display:inline-flex;align-items:center;gap:.4rem;border:0;background:none;padding:.15rem .4rem;border-radius:.45rem;font-weight:600;font-size:var(--fs-sm);color:var(--fg);white-space:nowrap}
.pickp{border:1px solid var(--line);background:var(--card);padding:.35rem .6rem;font-size:var(--fs-lg)}
.pb:hover,.pickp:hover{background:var(--accent-soft)}
#pmenu{position:fixed;z-index:60;min-width:11rem;background:var(--card);border:1px solid var(--line);border-radius:.7rem;box-shadow:var(--shadow);padding:.3rem}
#pmenu button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;border:0;background:none;padding:.4rem .7rem;border-radius:.4rem;font-size:var(--fs-lg)}
#pmenu button:hover{background:var(--accent-soft)}#pmenu .cur{font-weight:600}
#pmenu .mh{padding:.35rem .7rem .1rem;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#pmenu .cz{display:flex;gap:.3rem;padding:.2rem .5rem .4rem}
#pmenu .cz input{width:4rem;font-size:var(--fs-md);padding:.2rem .4rem}#pmenu .cz select{font-size:var(--fs-md);padding:.2rem .3rem}
#pmenu .cz button{width:auto;background:var(--accent);color:#fff;font-size:var(--fs-xs);padding:.12rem .6rem;justify-content:center}

/* date & time picker */
.dt{position:relative;display:flex;gap:.3rem}
.dtbtn{flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-lg)}
.dtbtn.empty{color:var(--muted)}
.pop{position:absolute;top:calc(100% + .35rem);left:0;width:17.5rem;max-width:calc(100vw - 2rem);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:.8rem;box-shadow:var(--shadow);padding:.7rem}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;font-weight:600}
.cal-h button{border:0;background:none;font-size:1.15rem;line-height:1;padding:.25rem .65rem;border-radius:.4rem}
.cal-h button:hover{background:var(--accent-soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.15rem;text-align:center}
.cal b{font-size:var(--fs-xs);color:var(--muted);font-weight:500;padding-bottom:.2rem}
.day{border:0;background:none;aspect-ratio:1;padding:0;border-radius:50%;font-size:var(--fs-sm)}
.day:hover{background:var(--accent-soft)}.day.today{box-shadow:inset 0 0 0 1px var(--accent)}
.day.on,.day.on:hover{background:var(--accent);color:#fff}
.quick{display:flex;gap:.3rem;margin:.55rem 0}.quick button{flex:1;border-radius:1rem;padding:.15rem .3rem;font-size:var(--fs-xs)}
.tsel{display:flex;gap:.35rem;align-items:center;border-top:1px solid var(--line);padding-top:.55rem}
.tsel select{width:auto;padding:.25rem .3rem}.tsel .primary{margin-left:auto}

/* detail drawer */
#detail{position:fixed;top:0;right:0;bottom:0;width:min(var(--dw),100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;overflow-y:auto;z-index:20;padding:1rem 1.1rem}
#detail.open{transform:none;visibility:visible;transition:transform .22s ease}
.dd-h{display:flex;gap:.6rem;justify-content:space-between;align-items:flex-start}
.dd-h h2{margin:0 0 .2rem;font-size:var(--fs-xl);line-height:1.3;word-break:break-word}
.dsec{border-top:1px solid var(--line);padding-top:.7rem;margin-top:.9rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:0;font-size:var(--fs-md)}
dt{color:var(--muted);font-size:var(--fs-sm);padding-top:.05rem}dd{margin:0;word-break:break-word}
.pre{white-space:pre-wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:.4rem}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:.4rem;border:1px solid var(--line)}
.acts{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.9rem}

/* settings: categories on the left, one group of settings on the right */
.slayout{display:grid;grid-template-columns:12rem minmax(0,1fr);gap:1.2rem;max-width:58rem;margin:0 auto;align-items:start}
.snav{position:sticky;top:1rem;display:flex;flex-direction:column;gap:.2rem;background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.4rem}
.snav button{text-align:left;border:0;background:none;padding:.5rem .8rem;border-radius:.5rem}
.snav button:hover{background:var(--accent-soft)}.snav button.on{background:var(--accent);color:#fff}
#snavl{display:flex;flex-direction:column;gap:.2rem}.snav input{margin:.2rem .2rem .3rem}
.snav .sub{padding:.3rem .8rem .3rem 1.6rem;font-size:var(--fs-sm);color:var(--muted)}
.subs{display:flex;flex-direction:column;gap:.2rem;overflow:hidden}
.snav .car{float:right;opacity:.6;transition:transform .2s}.snav button.on .car{transform:rotate(90deg)}
/* a newly opened category rolls its list down, items dropping in one after another */
.subs.roll .sub{animation:subin .3s ease-out backwards;animation-delay:calc(var(--i)*35ms)}.snav button.roll .car{animation:car .25s ease-out}
@keyframes subin{from{opacity:0;transform:translateY(-.4rem)}}@keyframes car{from{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.subs.roll .sub{animation:none}}
/* Animations setting off: nothing moves, except the Mark done countdown bar, which shows the time left to cancel */
[data-anim=off] :not(.cd>i),[data-anim=off] ::before,[data-anim=off] ::after{animation:none!important;transition:none!important}.snav .sub small{display:block;font-size:var(--fs-xs)}
@media(max-width:45rem){.slayout{grid-template-columns:1fr}.snav{position:static}#snavl{flex-direction:row;overflow-x:auto}.subs{display:contents}.snav .car{display:none}.snav button{white-space:nowrap}}
.settings{margin:0 0 .9rem;background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:1rem 1.2rem 1.1rem}
.settings label{display:block;margin:.8rem 0 .2rem;font-size:var(--fs-sm);color:var(--muted)}
.settings>h3+label{margin-top:0}
.settings select,.settings input:not([type=file]):not([type=checkbox]){width:100%}
.settings label.chk{display:flex;margin:.35rem 0;font-size:var(--fs-md);color:var(--fg)}
.settings .fp{display:flex;gap:.7rem;align-items:center;font-size:var(--fs-md)}
.settings .fp button{width:auto}
.note{margin:.6rem 0 0;font-size:var(--fs-xs);color:var(--muted)}
.path{display:block;padding:.4rem .6rem;border:1px solid var(--line);border-radius:.4rem;background:var(--bg);font:var(--fs-sm)/1.4 ui-monospace,Consolas,monospace;word-break:break-all}
.frow{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
.btn{display:inline-flex;align-items:center;font-size:var(--fs-xs);padding:.12rem .55rem;border:1px solid var(--line);border-radius:.35rem;background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}.settings label.btn{display:inline-flex;margin:0;font-size:var(--fs-xs);color:var(--fg)}
#fpre{margin:.7rem 0 0;max-height:20rem;overflow:auto;padding:.7rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg);font:var(--fs-xs)/1.5 ui-monospace,Consolas,monospace}
.fres{margin-top:.7rem;padding:.5rem .7rem;border-radius:.5rem;background:var(--ok-bg);color:var(--ok-fg);font-size:var(--fs-sm)}.fres.bad{background:var(--bad-bg);color:var(--bad-fg)}
/* tag lists */
.tags{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.45rem;border:1px solid var(--line);border-radius:.6rem;background:var(--bg);min-height:2.6rem}
.tags:focus-within{border-color:var(--accent)}
.tg{display:inline-flex;align-items:center;gap:.1rem;padding:.1rem .3rem .1rem .75rem;border:1px solid transparent;border-radius:2rem;background:var(--accent-soft);color:var(--accent-text);font-size:var(--fs-md);cursor:grab}
.tg.locked{padding-right:.75rem}.tg.over{border-color:var(--accent)}
.tgt{cursor:text}.tg.locked .tgt,.tags:has(.tgsel) .tgt{cursor:inherit}
.tgx{border:0;background:none;color:inherit;padding:0 .4rem;font-size:1rem;line-height:1.3;border-radius:50%;opacity:.7}
.tgx:hover{opacity:1;background:var(--bad-bg);color:var(--bad-fg)}
.settings .tags input,.settings .tags select{width:auto}.tgin{flex:1;min-width:9rem;border:0;background:transparent;padding:.25rem .3rem;font-size:var(--fs-md);outline:none}
.tgedit{flex:none;min-width:5rem;padding:.1rem .6rem;border:1px solid var(--accent);border-radius:2rem;font-size:var(--fs-md)}
.tgsel{padding:.15rem .5rem;border-radius:2rem;font-size:var(--fs-sm)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,.6rem);padding:.4rem .95rem;border-radius:1.5rem;background:var(--fg);color:var(--bg);font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--danger);color:#fff}
</style></head><body>
<div id="page">

</div>

<div id="toast" class="toast" role="status"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
document.documentElement.dataset.theme=localStorage.theme||"auto";  // applied before first paint
let S,T,L={},view=localStorage.view||"queue",F={q:"",prio:"all",price:null,paid:"any",type:"all",est:null,estSort:"",snoozed:false,done:false},sel=null;
const t=k=>L[k]??k;
const api=async(m,u,b,h={})=>{const r=await fetch(u,{method:m,body:b===undefined?undefined:(typeof b=="string"||b instanceof Blob?b:JSON.stringify(b)),headers:h});const j=await r.json();
  if(!r.ok){const k="err_"+j.error;throw new Error(t(k)!=k?t(k):j.error)}return j};
let wakeTimer;
async function load(){S=await api("GET","/api/state");T=S.tasks;
  const next=Math.min(...T.filter(snoozed).map(x=>new Date(x.snoozed_until)-Date.now()));  // reload when the next snooze ends, so the task moves back
  clearTimeout(wakeTimer);if(isFinite(next))wakeTimer=setTimeout(load,Math.min(next+1000,864e5));
  localStorage.theme=document.documentElement.dataset.theme=S.settings.theme;document.documentElement.dataset.anim=S.settings.animations?"on":"off";
  L=await fetch(`/locales/${S.settings.language}.json`).then(r=>r.json());render()}

/* ---------- helpers ---------- */
const CURS=["USD","CNY","EUR","GBP","JPY","KRW","HKD","TWD","CAD","AUD","SGD"];
const defCur=()=>S.settings.currency||L.default_currency||"USD";
const cur=x=>x.currency||defCur();
const A_="[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+";
const EMAIL_RE=new RegExp("^"+A_+"(?:\\."+A_+")*@(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,}$");
const UN={min:1,mins:1,minute:1,minutes:1,m:1,"分":1,"分钟":1,h:60,hr:60,hrs:60,hour:60,hours:60,"时":60,"小时":60,d:1440,day:1440,days:1440,"天":1440,"日":1440};
function parseDur(s){s=s.toLowerCase().replace(/[\s,]/g,"");if(!s)return"";
  const toks=[...s.matchAll(/(\d+(?:\.\d+)?)([^\d.]*)/g)];
  if(!toks.length||toks.map(m=>m[0]).join("")!=s)throw 0;
  let sum=0;toks.forEach(([,n,u],i)=>{if(Object.hasOwn(UN,u))sum+=n*UN[u];else if(u===""&&i==toks.length-1)sum+=+n;else throw 0});
  return Math.round(sum)}
const fmtDur=m=>{if(m==="")return"";const d=Math.floor(m/1440),h=Math.floor(m%1440/60),n=m%60;return(d?d+"d":"")+(h?h+"h":"")+(n?n+"min":"")||"0min"};
const loc=()=>L.intl||S.settings.language;
const fmtT=(h,m)=>L.hour12?`${h%12||12}:${pad(m)} ${t(h<12?"am":"pm")}`:`${pad(h)}:${pad(m)}`;
const fmtD=d=>d.toLocaleDateString(loc(),{year:"numeric",month:"short",day:"numeric",weekday:"short"});
const fmtDT=v=>{if(!v)return"";const d=new Date(v);return isNaN(d)?v:`${fmtD(d)} · ${fmtT(d.getHours(),d.getMinutes())}`};
const fmtBytes=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(1)+" MB";
const localISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const safe=s=>{try{return JSON.parse(s||"[]")}catch{return[]}};
const photosOf=x=>x.photos?x.photos.split(";").filter(Boolean):[];
const purl=p=>"/"+p.replace(/^task_records\//,"").split("/").map(encodeURIComponent).join("/");  // CSV address -> URL; names follow the task title: may hold spaces, # or non-ASCII
const pr=p=>S.settings.priorities.indexOf(p);
const snoozed=x=>x.snoozed_until&&new Date(x.snoozed_until)>new Date();
const bars=(on,n)=>{const w=80,g=38,H=495,W=n*w+(n-1)*g;  // n bars (one per priority level), the first `on` filled
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" width="${(W/H*1.05).toFixed(2)}em" height="1.05em" aria-hidden="true">${[...Array(n)].map((_,i)=>`<rect class="${i<on?"on":"off"}" x="${i*(w+g)}" y="${n>1?H-(100+i*(H-100)/(n-1)):0}" width="${w}" height="${n>1?100+i*(H-100)/(n-1):H}" rx="40"/>`).join("")}</svg>`};
const pbars=p=>{const n=S.settings.priorities.length,i=pr(p);return bars(i<0?0:n-i,n)};
const pbadge=x=>`<button type="button" class="pb" data-pm="${x.id}" title="${t("priority")}">${pbars(x.priority)}${esc(x.priority)}</button>`;
const combo=e=>[e.ctrlKey&&"Ctrl",e.altKey&&"Alt",e.shiftKey&&"Shift",e.metaKey&&"Meta",e.key==" "?"Space":e.key?.length==1?e.key.toUpperCase():e.key].filter(Boolean).join("+");  // e.g. "Shift+Enter", "Ctrl+S"
const chip=(txt,cls="")=>`<span class="chip ${cls}">${txt}</span>`;
const GEAR=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
const INFO=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`;
const PAY_COLORS={Wechat:"#07c160",Alipay:"#1677ff",Paypal:"#003087",Stripe:"#635bff",Zelle:"#6d1ed4",Venmo:"#008cff",Vgen:"#ff5c38"};
const payIcon=n=>{if(!n)return"";const u=S.settings.payment_icons[n];if(u)return `<img class="picon" src="${esc(u)}" alt="">`;
  const c=PAY_COLORS[n]||`hsl(${[...n].reduce((h,ch)=>(h*31+ch.codePointAt(0))>>>0,7)%360} 55% 42%)`;  // other methods: a steady colour from the name
  return `<span class="picon" style="background:${c}" aria-hidden="true">${esc([...n][0].toUpperCase())}</span>`};
function goSetting(tab,id){view=localStorage.view="settings";stab=localStorage.stab=tab;sel=null;render();
  const el=$("#"+id);if(el){el.scrollIntoView({block:"center"});(el.closest(".settings")||el).classList.add("flashset")}}

/* ---------- small popup menus (priority, snooze) ---------- */
function closeMenu(){$("#pmenu")?.remove()}
function popMenu(anchor,html,onpick){const old=$("#pmenu");closeMenu();if(old&&old._a===anchor)return;  // clicking the same button again closes it
  const m=document.createElement("div");m.id="pmenu";m._a=anchor;m.setAttribute("role","menu");m.innerHTML=html;
  (anchor.closest("dialog")||document.body).appendChild(m);  // inside the dialog, or the modal would block it
  const r=anchor.getBoundingClientRect(),h=m.offsetHeight,w=m.offsetWidth;
  m.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+"px";m.style.top=(r.bottom+4+h>innerHeight?Math.max(8,r.top-h-4):r.bottom+4)+"px";
  m.onclick=onpick}
function prioMenu(anchor,cur,pick){const P=S.settings.priorities;
  popMenu(anchor,P.map((p,i)=>`<button type="button" role="menuitem" data-p="${i}" class="${p==cur?"cur":""}">${bars(P.length-i,P.length)}<span>${esc(p)}</span></button>`).join(""),
    e=>{const b=e.target.closest("[data-p]");if(b){closeMenu();pick(P[+b.dataset.p])}})}
const pmClick=b=>{const x=T.find(y=>y.id==b.dataset.pm);prioMenu(b,x.priority,async p=>{await api("POST","/api/tasks",{id:x.id,priority:p});load()})};
const SNOOZES=[["1h",60],["2h",120],["1d",1440],["2d",2880],["7d",10080]];
const snooze=async(id,mins)=>{await api("POST","/api/tasks",{id,snoozed_until:localISO(new Date(Date.now()+mins*6e4))});load()};
function snoozeMenu(anchor,id){
  popMenu(anchor,`<div class="mh">${t("snooze_for")}</div>`+SNOOZES.map(([k,m])=>`<button type="button" role="menuitem" data-sz="${m}">${t("snooze_"+k)}</button>`).join("")+
    `<div class="mh">${t("snooze_custom")}</div><div class="cz"><input id="czn" type="number" min="1" value="3"><select id="czu"><option value="1">${t("unit_min")}</option><option value="60" selected>${t("unit_h")}</option><option value="1440">${t("unit_d")}</option></select><button type="button" class="primary" data-cz>${t("snooze_ok")}</button></div>`,
    e=>{let mins;const b=e.target.closest("[data-sz]");
      if(b)mins=+b.dataset.sz;
      else if(e.target.closest("[data-cz]")){const n=+$("#czn").value;if(!(n>0))return;mins=n*+$("#czu").value}
      else return;  // clicks inside the custom inputs keep the menu open
      if(isNaN(new Date(Date.now()+mins*6e4)))return;closeMenu();snooze(id,mins)})}
/* a range picked with two sliders or typed in; apply(null) = no range. read() turns typed text into a number ("" = open end) and throws if it can't */
function rangeMenu(anchor,{max,step,val,show,read,extra="",apply}){
  const sv=v=>Math.min(v,max),lab=[t("range_min"),t("range_max")];
  popMenu(anchor,`<div class="rpop"><div class="dual"><i></i>${val.map((v,i)=>`<input type="range" min="0" max="${max}" step="${step}" value="${sv(v)}" aria-label="${lab[i]}">`).join("")}</div>
    <div class="rin">${val.map((v,i)=>`<input value="${esc(show(v))}" aria-label="${lab[i]}">`).join("–")}</div>${extra}
    <div class="racts"><button type="button" data-rc>${t("clear")}</button><button type="button" class="primary" data-ra>${t("apply")}</button></div></div>`,
    e=>{if(e.target.closest("[data-rc]")){apply(null,null);closeMenu()}else if(e.target.closest("[data-ra]"))go()});
  const m=$("#pmenu"),rs=[...m.querySelectorAll(".dual input")],ts=[...m.querySelectorAll(".rin input")],fill=$(".dual i",m);
  const paint=()=>{const[a,b]=rs.map(r=>+r.value).sort((x,y)=>x-y);fill.style.left=a/max*100+"%";fill.style.width=(b-a)/max*100+"%"};
  rs.forEach(r=>r.oninput=()=>{const v=rs.map(r=>+r.value).sort((x,y)=>x-y);ts.forEach((x,i)=>{x.value=show(v[i]);x.classList.remove("bad")});paint()});
  ts.forEach((x,i)=>x.onchange=()=>{try{const v=read(x.value);rs[i].value=v===""?(i?max:0):sv(v);x.classList.remove("bad")}catch{x.classList.add("bad")}paint()});
  function go(){let lo,hi;try{lo=read(ts[0].value);hi=read(ts[1].value)}catch{return ts.forEach(x=>{try{read(x.value)}catch{x.classList.add("bad")}})}
    lo=lo===""?0:lo;hi=hi===""?Infinity:hi;if(lo>hi)[lo,hi]=[hi,lo];
    apply(lo<=0&&hi>=max?null:[lo,hi],m);closeMenu()}  // a range covering everything is no range
  m.onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();go()}};paint()}
const numRead=v=>{v=v.trim();if(!v)return"";const n=+v;if(!(n>=0&&isFinite(n)))throw 0;return n};
const lastPrice=()=>{try{const[a,b]=JSON.parse(localStorage.priceRange);return[a,b??Infinity]}catch{return null}};  // JSON keeps an open end as null
const fullTitle=x=>{const nets=[...new Set(safe(x.client_socials).map(r=>r.net))].join("/");
  const parts={type:x.type,social:nets,title:x.title,price:x.price&&x.price+cur(x),paid:x.paid&&t("yes")};
  return S.settings.title_order.map(k=>parts[k]).filter(Boolean).join(" - ")};
const sel_=(n,o,v,blank)=>`<select name="${n}">${blank?'<option value=""></option>':""}${o.map(a=>`<option ${a==v?"selected":""}>${esc(a)}</option>`).join("")}</select>`;
const withVal=(list,v)=>v&&!list.includes(v)?[...list,v]:list;
const curSel=(n,v)=>sel_(n,CURS.includes(v)?CURS:[...CURS,v],v);

/* ---------- date & time picker ---------- */
const dtField=(name,val,mode)=>`<div class="dt" data-mode="${mode}"><input type="hidden" name="${name}" value="${esc(val)}"><button type="button" class="dtbtn"></button><button type="button" class="dtx" title="${t("clear")}">×</button><div class="pop hide"></div></div>`;
function bindDt(el){const inp=$("input",el),btn=$(".dtbtn",el),clr=$(".dtx",el),pop=$(".pop",el);let vy,vm;
  const val=()=>inp.value?new Date(inp.value):null;
  const label=()=>{btn.textContent="📅  "+(inp.value?fmtDT(inp.value):t("pick_datetime"));btn.classList.toggle("empty",!inp.value);clr.classList.toggle("hide",!inp.value)};
  const defTime=()=>{if(el.dataset.mode=="now"){const n=new Date();return[n.getHours(),n.getMinutes()]}return S.settings.default_due_time.split(":").map(Number)};
  const setVal=(y,m,d,h,mi)=>{inp.value=localISO(new Date(y,m,d,h,mi));label()};
  const pickDay=(y,m,d)=>{const c=val(),[h,mi]=c?[c.getHours(),c.getMinutes()]:defTime();setVal(y,m,d,h,mi);vy=y;vm=m;draw()};
  function draw(){const c=val(),now=new Date(),ws=L.week_start|0,lead=(new Date(vy,vm,1).getDay()-ws+7)%7,n=new Date(vy,vm+1,0).getDate();
    const same=(d,y,m,dd)=>d&&d.getFullYear()==y&&d.getMonth()==m&&d.getDate()==dd;
    const wd=[...Array(7)].map((_,i)=>`<b>${new Date(2024,0,7+(i+ws)%7).toLocaleDateString(loc(),{weekday:"narrow"})}</b>`).join("");
    const days=[...Array(lead)].map(()=>"<i></i>").join("")+[...Array(n)].map((_,i)=>`<button type="button" class="day ${same(now,vy,vm,i+1)?"today":""} ${same(c,vy,vm,i+1)?"on":""}" data-day="${i+1}">${i+1}</button>`).join("");
    const mins=[...Array(12)].map((_,i)=>i*5);if(c&&!mins.includes(c.getMinutes()))mins.push(c.getMinutes()),mins.sort((a,b)=>a-b);
    pop.innerHTML=`<div class="cal-h"><button type="button" data-nav="-1">‹</button><span>${new Date(vy,vm,1).toLocaleDateString(loc(),{year:"numeric",month:"long"})}</span><button type="button" data-nav="1">›</button></div>
    <div class="cal">${wd}${days}</div>
    <div class="quick"><button type="button" data-q="0">${t("today")}</button><button type="button" data-q="1">${t("tomorrow")}</button><button type="button" data-q="7">${t("next_week")}</button></div>
    <div class="tsel"><span>${t("time")}</span><select class="th_" ${c?"":"disabled"} aria-label="${t("hour")}">${[...Array(24)].map((_,h)=>`<option value="${h}" ${c&&c.getHours()==h?"selected":""}>${fmtT(h,0).replace(":00","")}</option>`).join("")}</select>:
    <select class="tm_" ${c?"":"disabled"} aria-label="${t("minute")}">${mins.map(m=>`<option value="${m}" ${c&&c.getMinutes()==m?"selected":""}>${pad(m)}</option>`).join("")}</select>
    <button type="button" class="primary" data-done>${t("done")}</button></div>`}
  pop.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.nav){const d=new Date(vy,vm+ +b.dataset.nav,1);vy=d.getFullYear();vm=d.getMonth();draw()}
    else if(b.dataset.day)pickDay(vy,vm,+b.dataset.day);
    else if(b.dataset.q){const d=new Date(Date.now()+ +b.dataset.q*864e5);pickDay(d.getFullYear(),d.getMonth(),d.getDate())}
    else if("done" in b.dataset)pop.classList.add("hide")};
  pop.onchange=()=>{const c=val();if(c)setVal(c.getFullYear(),c.getMonth(),c.getDate(),+$(".th_",pop).value,+$(".tm_",pop).value)};
  btn.onclick=()=>{if(!pop.classList.contains("hide"))return pop.classList.add("hide");
    document.querySelectorAll(".dt .pop").forEach(p=>p.classList.add("hide"));
    const b=val()||new Date();vy=b.getFullYear();vm=b.getMonth();draw();pop.classList.remove("hide")};
  clr.onclick=()=>{inp.value="";label();pop.classList.add("hide")};
  label()}
document.addEventListener("click",e=>{const path=e.composedPath();  // composedPath: the clicked node may already be re-rendered away
  const pm=$("#pmenu");if(pm&&!path.includes(pm)&&!path.includes(pm._a))closeMenu();
  document.querySelectorAll(".dt .pop:not(.hide)").forEach(p=>{if(!path.includes(p.parentElement))p.classList.add("hide")})});
document.addEventListener("keydown",e=>{if(e.key!="Escape"||$("#dlg").open)return;if($("#pmenu"))closeMenu();else if(sel){sel=null;render()}});
$("#dlg").addEventListener("cancel",e=>{const open=document.querySelectorAll(".dt .pop:not(.hide)");if(open.length||$("#pmenu")){e.preventDefault();open.forEach(p=>p.classList.add("hide"));closeMenu()}});

/* ---------- list / board ---------- */
function chrome(){document.title=$("#appname").textContent=t("app");
  document.querySelectorAll("[data-v]").forEach(b=>{if(b.id=="gear"){b.innerHTML=GEAR;b.title=t("settings");b.setAttribute("aria-label",t("settings"))}else b.textContent=t(b.dataset.v);b.classList.toggle("on",b.dataset.v==view);b.onclick=()=>{view=b.dataset.v;localStorage.view=view;render()}});
  $("#add").textContent=t("add_task");$("#add").onclick=()=>edit();
  const ls=$("#lang");ls.title=t("language");ls.innerHTML=Object.entries(S.languages).map(([c,n])=>`<option value="${c}" ${c==S.settings.language?"selected":""}>${esc(n)}</option>`).join("");
  ls.onchange=async()=>{await api("POST","/api/settings",{language:ls.value});load()}}
const DONE_MS=7000,pending={};  // task id -> {start, timer} while a Mark done countdown runs
const CHECK="M140 255L240 375L410 165";
const doneIcon=on=>on?`<svg viewBox="0 0 550 550" aria-hidden="true"><circle cx="275" cy="275" r="275" fill="#00873a"/><path d="${CHECK}" fill="none" stroke="#fff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  :`<svg viewBox="0 0 550 550" aria-hidden="true" style="color:var(--accent)"><circle cx="275" cy="275" r="262" fill="none" stroke="currentColor" stroke-width="26"/><path d="${CHECK}" fill="none" stroke="currentColor" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/><path d="${CHECK}" fill="none" stroke="var(--card)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const doneBtn=x=>{const p=pending[x.id];return x.status=="Completed"?"":`<button class="sm mdone" data-a="done" data-id="${x.id}" aria-pressed="${!!p}" title="${p?t("done_undo_hint"):""}">${doneIcon(p)}${t("mark_done")}</button>`};
const doneBar=x=>{const p=pending[x.id];return p?`<div class="cd"><i style="animation-duration:${DONE_MS}ms;animation-delay:-${Date.now()-p.start}ms"></i></div>`:""};
const snoozeBtns=(x,cls="sm")=>`${snoozed(x)?`<button class="${cls}" data-a="unsnz" data-id="${x.id}">${t("cancel_snooze")}</button>`:""}<button class="${cls}" data-a="snz" data-id="${x.id}">${t("snooze")} ▾</button>`;
function card(x,board){const soc=safe(x.client_socials).map(s=>`${esc(s.net)}: ${esc(s.handle)}`).join(", ");
  const facts=[["price",x.price&&`${esc(x.price)} ${esc(cur(x))}`],["estimate_short",esc(x.estimate)],["due_short",x.due&&esc(fmtDT(x.due))]].filter(f=>f[1]);
  const client=[x.client_name,x.client_email].filter(Boolean).map(esc).concat(soc?[soc]:[]).join(" · "),ph=photosOf(x);
  return `<div class="card ${snoozed(x)?"snoozed":""} ${sel==x.id?"sel":""}" data-id="${x.id}" ${board?'draggable="true"':""}>
  <div class="c-top"><div class="c-title">${esc(fullTitle(x))}</div>${pbadge(x)}</div>
  <div class="chips">${x.type?chip(esc(x.type),"gray"):""}${board?"":chip(t(x.status),"gray")}${x.price?chip(x.paid?payIcon(x.payment_method)+t("yes"):t("no"),x.paid?"ok":"bad"):""}${snoozed(x)?chip("💤 "+esc(fmtDT(x.snoozed_until)),"zz"):""}</div>
  ${facts.length?`<div class="facts">${facts.map(([k,v])=>`<div class="fact"><small>${t(k)}</small><span>${v}</span></div>`).join("")}</div>`:""}

async function act(a,id,btn){const x=T.find(y=>y.id==id);

/* ---------- settings ---------- */
const PARTS=["type","social","title","price","paid"];
let stab=localStorage.stab||"display",rolled=stab,importNote=null,toastTimer,sq="";  // sq = settings search text, kept while the page redraws
// loose match like most apps: each word of the query appears with its letters in order, gaps allowed ("pay meth", "pymt" find "Payment methods")
const fuzzy=(q,s)=>{s=s.toLowerCase();return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>{let i=0;for(const c of s)if(c==w[i])i++;return i>=w.length})};
console.assert(fuzzy("pay meth","Payment methods")&&fuzzy("PYMT","payment")&&fuzzy("","x")&&!fuzzy("xyz","Theme")&&!fuzzy("emeht","Theme"),"fuzzy");
// each query word loosely matches one word of the task, so letters spread across long notes don't count as a hit
const findTask=(q,x)=>{const h=[fullTitle(x),x.title,x.type,x.priority,t(x.status),x.client_name,x.client_email,x.payment_method,x.notes,...safe(x.client_socials).map(r=>r.net+" "+r.handle)].join(" ").toLowerCase().split(/\s+/);
  return q.split(/\s+/).filter(Boolean).every(w=>h.some(v=>fuzzy(w,v)))};
function flash(msg,bad){const el=$("#toast");el.textContent=msg;el.classList.toggle("bad",!!bad);el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),bad?4000:1600)}
let saving=Promise.resolve();
function saveSettings(patch){  // every setting saves as soon as it changes; saves go out one after another so the page never shows a stale copy
  // patch may be a function of the current settings: it runs when its turn comes, so it builds on the saves queued before it
  return saving=saving.then(async()=>{
    try{S.settings=await api("POST","/api/settings",typeof patch=="function"?patch(S.settings):patch);flash(t("saved"))}
    catch(er){flash(er.message,true);await load()}  // show the problem, then fall back to what the server really has
  })
}
/* a list shown as removable, renamable, draggable tags; with `allowed` it is a fixed set of parts to pick from */
function tagEditor(el,{items,save,allowed}){let list=[...items],drag=null;
  const locked=v=>allowed&&v=="title";  // the title part can't be removed
  const has=(v,except)=>list.some((x,i)=>i!==except&&x.toLowerCase()==v.toLowerCase());
  const commit=ren=>save([...list],ren);  // ren = {from,to} when a tag was renamed
  const draw=()=>{const rest=allowed?allowed.filter(v=>!list.includes(v)):[];
    el.innerHTML=list.map((v,i)=>`<span class="tg ${locked(v)?"locked":""}" draggable="true" data-i="${i}"><span class="tgt" ${allowed?"":`title="${t("edit")}"`}>${allowed?t("part_"+v):esc(v)}</span>${locked(v)?"":`<button type="button" class="tgx" data-x="${i}" title="${t("remove")}" aria-label="${t("remove")}">×</button>`}</span>`).join("")+
      (allowed?(rest.length?`<select class="tgsel"><option value="">${t("part_add")}</option>${rest.map(v=>`<option value="${v}">${t("part_"+v)}</option>`).join("")}</select>`:""):`<input class="tgin" maxlength="40" placeholder="${t("tag_add")}" aria-label="${t("tag_add")}">`)};
  const add=v=>{v=v.trim();if(!v||has(v))return false;list.push(v);commit();return true};
  const rename=(span,i)=>{const chip=span.closest(".tg"),inp=document.createElement("input");chip.draggable=false;  // a draggable parent blocks selecting text
    inp.className="tgedit";inp.maxLength=40;inp.value=list[i];span.replaceWith(inp);inp.focus();inp.select();let done=false;
    const finish=ok=>{if(done)return;done=true;const v=inp.value.trim();if(ok&&v&&v!==list[i]&&!has(v,i)){const from=list[i];list[i]=v;commit({from,to:v})}draw()};
    inp.onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();finish(true)}else if(e.key=="Escape"){e.preventDefault();e.stopPropagation();finish(false)}};
    inp.onblur=()=>finish(true)};
  el.onkeydown=e=>{if(e.target.matches(".tgin")&&(e.key=="Enter"||e.key==",")){e.preventDefault();const v=e.target.value;e.target.value="";if(add(v)){draw();$(".tgin",el).focus()}}};
  el.addEventListener("focusout",e=>{if(e.target.matches(".tgin")&&e.target.value.trim()){const v=e.target.value;e.target.value="";if(add(v))draw()}});  // text typed but not confirmed is kept
  el.onchange=e=>{if(e.target.matches(".tgsel")&&e.target.value){list.push(e.target.value);commit();draw()}};
  el.onclick=e=>{const x=e.target.closest("[data-x]");if(x){list.splice(+x.dataset.x,1);commit();draw();return}
    const tt=e.target.closest(".tgt");if(tt&&!allowed)rename(tt,+tt.closest(".tg").dataset.i)};
  el.ondragstart=e=>{const c=e.target.closest(".tg");if(!c)return;drag=+c.dataset.i;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(drag))};
  el.ondragover=e=>{const c=e.target.closest(".tg");if(drag===null||!c)return;e.preventDefault();el.querySelectorAll(".over").forEach(o=>o.classList.remove("over"));c.classList.add("over")};
  el.ondrop=e=>{const c=e.target.closest(".tg");if(drag===null||!c)return;e.preventDefault();const j=+c.dataset.i;
    if(j!==drag){const [v]=list.splice(drag,1);list.splice(j,0,v);commit()}drag=null;draw()};
  el.ondragend=()=>{drag=null;draw()};
  draw()}
async function iconURL(file){  // shrink to a 64px square so the icon fits in settings.json
  const img=await createImageBitmap(file),n=64,k=Math.min(n/img.width,n/img.height),c=document.createElement("canvas");c.width=c.height=n;
  c.getContext("2d").drawImage(img,(n-img.width*k)/2,(n-img.height*k)/2,img.width*k,img.height*k);
  for(const q of [1,.85,.6,.35]){const u=q==1?c.toDataURL("image/png"):c.toDataURL("image/webp",q);if(u.startsWith("data:image/")&&u.length<=20000)return u}  // 20000 = the server's ICON_MAX; detailed pictures don't fit as png
  throw 0}
function settings(m){const s=S.settings,fp=S.finished_photos;
  const opt=(v,l,cur_)=>`<option value="${esc(v)}" ${v==cur_?"selected":""}>${esc(l)}</option>`;
  const card=(title,body)=>`<div class="settings"><h3>${title}</h3>${body}</div>`;
  const pane={
    display:()=>card(t("theme"),`<select id="sth" aria-label="${t("theme")}">${["auto","light","dark"].map(v=>opt(v,t("theme_"+v),s.theme)).join("")}</select>`)+
      card(t("animations"),`<label class="chk"><input type="checkbox" id="set-anim" ${s.animations?"checked":""}> ${t("animations_on")}</label><p class="note">${t("animations_hint")}</p>`)+
      card(t("completed_limit"),`<input id="set-completed" type="number" min="1" max="500" step="1" value="${s.completed_limit}" aria-label="${t("completed_limit")}"><p class="note">${t("completed_limit_hint")}</p>`),
    newtask:()=>card(t("default_priority"),`<select id="sdp" aria-label="${t("default_priority")}">${s.priorities.map(p=>opt(p,p,s.default_priority)).join("")}</select>`)+
      card(t("default_due_time"),`<select id="sdt" aria-label="${t("default_due_time")}">${[...Array(24)].map((_,h)=>opt(pad(h)+":00",fmtT(h,0),s.default_due_time)).join("")}</select>`)+
      card(t("ready_priorities"),`<div id="set-ready">${s.priorities.map(p=>`<label class="chk"><input type="checkbox" data-rdy="${esc(p)}" ${s.ready_priorities.includes(p)?"checked":""}> ${pbars(p)} ${esc(p)}</label>`).join("")}</div><p class="note">${t("ready_priorities_hint")}</p>
        <label class="chk" style="margin-top:.8rem"><input type="checkbox" id="set-paid-ready" ${s.paid_ready?"checked":""}> ${t("paid_ready")}</label><p class="note">${t("paid_ready_hint")}</p>`),
    fields:()=>card(t("types_label"),`<div class="tags" id="tg-types"></div><p class="note">${t("tag_hint")}</p>`)+
      card(t("socials_label"),`<div class="tags" id="tg-socials"></div><p class="note">${t("tag_hint")}</p>`)+
      card(t("title_format"),`<div class="tags" id="tg-title"></div><p class="note">${t("title_format_hint")}</p>`),
    payments:()=>card(t("currency"),`<select id="scur" aria-label="${t("currency")}">${opt("",`${t("currency_auto")} (${L.default_currency||"USD"})`,s.currency)}${(CURS.includes(s.currency)||!s.currency?CURS:[...CURS,s.currency]).map(c=>opt(c,c,s.currency)).join("")}</select>`)+
      card(t("payment_methods_label"),`<div class="tags" id="tg-pay"></div><p class="note">${t("tag_hint")}</p><label>${t("payment_icons")}</label><div id="pay-icons"></div>`),
    shortcuts:()=>card(t("cat_shortcuts"),Object.entries(s.shortcuts).map(([k,v])=>`<label>${t("sc_"+k)}</label><button class="sm" id="sc-${k}" data-sc="${k}">${esc(v)}</button>`).join("")+`<p class="note">${t("sc_hint")}</p>`),
    data:()=>card(t("finished_photos"),`<div class="fp" id="set-fp"><span>${fp.count} ${t("files")} · ${fmtBytes(fp.bytes)}</span><button class="sm danger" id="fpclear" ${fp.count?"":"disabled"}>${t("clear_finished")}</button></div>`)+
      card(t("cat_file"),`<p class="note" style="margin-top:0">${t("file_intro")}</p>
      <label>${t("file_path")}</label><code class="path" id="set-fpath">${esc(S.settings_file)}</code>
      <div class="frow"><button class="sm" id="fview">${t("file_view")}</button><a class="btn" href="/api/settings/file" download="pupqueue-settings.json">${t("file_download")}</a>
      <label class="btn">${t("file_upload")}<input type="file" id="fup" accept=".json,application/json" hidden></label></div>
      <p class="note">${t("file_upload_help")}</p><pre id="fpre" class="hide"></pre>
      ${importNote?`<div class="fres ${importNote.ok?"":"bad"}">${importNote.html}</div>`:""}`)};
  if(!pane[stab])stab="display";
  // [category, element id to jump to, label]; the open category lists its items under it, and search looks through all of them
  const items=[["display","sth","theme"],["display","set-anim","animations"],["display","set-completed","completed_limit"],["newtask","sdp","default_priority"],["newtask","sdt","default_due_time"],
    ["newtask","set-ready","ready_priorities"],["newtask","set-paid-ready","paid_ready"],["fields","tg-types","types_label"],["fields","tg-socials","socials_label"],
    ["fields","tg-title","title_format"],["payments","scur","currency"],["payments","tg-pay","payment_methods_label"],...Object.keys(s.shortcuts).map(k=>["shortcuts","sc-"+k,"sc_"+k]),
    ["data","set-fp","finished_photos"],["data","set-fpath","cat_file"]];
  const sub=([c,id,k],cat,i)=>`<button class="sub" style="--i:${i}" data-go="${c}:${id}">${cat?`<small>${t("cat_"+c)}</small>`:""}${t(k)}</button>`;
  const drawNav=()=>{const q=sq.trim(),rank=it=>t(it[2]).toLowerCase().includes(q.toLowerCase())?0:1;  // whole-word hits before spread-out ones
    const hits=q&&items.filter(it=>fuzzy(q,t("cat_"+it[0])+" "+t(it[2]))).sort((a,b)=>rank(a)-rank(b));
    $("#snavl").innerHTML=q?hits.map(it=>sub(it,true)).join("")||`<p class="note">${t("no_results")}</p>`:
      Object.keys(pane).map(k=>{const own=items.filter(it=>it[0]==k),open=k==stab,roll=open&&rolled!=k?"roll":"";  // only a newly opened category rolls open, not every redraw
        return `<button data-tab="${k}" class="${open?"on":""} ${roll}" aria-expanded="${open}">${t("cat_"+k)}<span class="car" aria-hidden="true">›</span></button>`+
          (open?`<div class="subs ${roll}">${own.map((it,i)=>sub(it,false,i)).join("")}</div>`:"")}).join("");
    if(!q)rolled=stab};
  m.innerHTML=`<div class="slayout"><nav class="snav"><input type="search" id="ssearch" placeholder="${t("search_settings")}" aria-label="${t("search_settings")}" value="${esc(sq)}"><div id="snavl"></div></nav><div class="spane">${pane[stab]()}</div></div>`;
  drawNav();
  // unfold downward from 0 to the list's real height; kept with reduced motion on since it is a short, small expand (only the items' drop-in is skipped)
  const rl=s.animations&&$(".subs.roll");if(rl)rl.animate([{height:0},{height:rl.scrollHeight+"px"}],{duration:350,easing:"cubic-bezier(.2,.7,.3,1)"});
  const ss=$("#ssearch");ss.oninput=()=>{sq=ss.value;drawNav()};
  ss.onkeydown=e=>{if(e.key=="Enter")$("#snavl [data-go]")?.click();else if(e.key=="Escape"&&ss.value){e.preventDefault();ss.value=sq="";drawNav()}};
  $("#snavl").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){stab=localStorage.stab=b.dataset.tab;importNote=null;render()}};
  if(stab=="display"){
    $("#sth").onchange=e=>{localStorage.theme=document.documentElement.dataset.theme=e.target.value;saveSettings({theme:e.target.value})};  // applies at once
    $("#set-anim").onchange=e=>{document.documentElement.dataset.anim=e.target.checked?"on":"off";saveSettings({animations:e.target.checked})};
    $("#set-completed").onchange=e=>{const v=+e.target.value;if(Number.isInteger(v)&&v>=1&&v<=500)saveSettings({completed_limit:v});else{flash(t("err_invalid_completed_limit"),true);e.target.value=S.settings.completed_limit}}}
  if(stab=="newtask"){
    $("#sdp").onchange=e=>saveSettings({default_priority:e.target.value});
    $("#sdt").onchange=e=>saveSettings({default_due_time:e.target.value});
    m.querySelectorAll("[data-rdy]").forEach(c=>c.onchange=()=>saveSettings({ready_priorities:[...m.querySelectorAll("[data-rdy]:checked")].map(i=>i.dataset.rdy)}));
    $("#set-paid-ready").onchange=e=>saveSettings({paid_ready:e.target.checked})}
  if(stab=="fields"){
    tagEditor($("#tg-types"),{items:s.types,save:v=>saveSettings({types:v})});
    tagEditor($("#tg-socials"),{items:s.socials,save:v=>saveSettings({socials:v})});
    tagEditor($("#tg-title"),{items:s.title_order,allowed:PARTS,save:v=>saveSettings({title_order:v})})}
  if(stab=="payments"){
    $("#scur").onchange=e=>saveSettings({currency:e.target.value});
    const icons=$("#pay-icons"),drawIcons=()=>{const ps=S.settings;
      icons.innerHTML=ps.payment_methods.map(n=>`<div class="prow">${payIcon(n)}<span class="pn">${esc(n)}</span><label class="btn">${t("icon_upload")}<input type="file" accept="image/*" hidden data-pi="${esc(n)}"></label>${ps.payment_icons[n]?`<button class="sm" data-pr="${esc(n)}">${t("icon_reset")}</button>`:""}</div>`).join("")};
    tagEditor($("#tg-pay"),{items:s.payment_methods,save:(v,ren)=>saveSettings(cs=>{const ic={...cs.payment_icons};  // a renamed method keeps its icon
      if(ren&&ic[ren.from]){ic[ren.to]=ic[ren.from];delete ic[ren.from]}return{payment_methods:v,payment_icons:ic}}).then(drawIcons)});
    icons.onchange=async e=>{const inp=e.target.closest("[data-pi]"),file=inp?.files[0];if(!file)return;inp.value="";
      let url;try{url=await iconURL(file)}catch{return flash(t("err_invalid_icon"),true)}
      await saveSettings(cs=>({payment_icons:{...cs.payment_icons,[inp.dataset.pi]:url}}));drawIcons()};
    icons.onclick=e=>{const b=e.target.closest("[data-pr]");if(!b)return;saveSettings(cs=>{const{[b.dataset.pr]:_,...rest}=cs.payment_icons;return{payment_icons:rest}}).then(drawIcons)};
    drawIcons()}
  if(stab=="shortcuts")m.querySelectorAll("[data-sc]").forEach(b=>{let rec=false;  // click, then press the new keys; Escape or clicking away cancels
    b.onclick=()=>{rec=true;b.textContent=t("sc_press");b.classList.add("on")};
    b.onblur=()=>{if(rec)render()};
    b.onkeydown=e=>{if(!rec||["Control","Alt","Shift","Meta"].includes(e.key))return;e.preventDefault();rec=false;
      const c=combo(e);if(c=="Escape")return render();
      if(Object.entries(s.shortcuts).some(([k,v])=>k!=b.dataset.sc&&v==c)){flash(t("err_invalid_shortcuts"),true);return render()}
      saveSettings({shortcuts:{...s.shortcuts,[b.dataset.sc]:c}}).then(render)}});
  if(stab=="data")$("#fpclear").onclick=async()=>{if(confirm(t("confirm_clear_finished"))){await api("POST","/api/photos/clear-finished");load()}};
  if(stab=="data"){
    $("#fview").onclick=async()=>{const pre=$("#fpre"),show=pre.classList.contains("hide");
      if(show)pre.textContent=await fetch("/api/settings/file").then(r=>r.text());

      catch(er){importNote={ok:false,html:esc(er.message)}}
